  "Exercise 1, continued: the permit side of `p :: ps` is `satisfiedWith_iff.mpr ⟨q, List.mem_cons_of_mem _ hq, hqe, hqs⟩`. For the forbid side of `p :: ps`, `simp [satisfiedWith, hp] at hnf ⊢` reduces it to what you already have.",
